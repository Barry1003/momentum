name: One-time Neon Auth lockfile refresh

on:
  push:
    branches:
      - feat/neon-managed-auth-integration-20261120

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Barry1003/momentum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile and retire this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-neon-lock-once.yml
          git add pnpm-lock.yaml .github/workflows/refresh-neon-lock-once.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: regenerate Neon Auth dependency lockfile'
            git push origin HEAD:feat/neon-managed-auth-integration-20261120
          fi
