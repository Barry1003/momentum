name: Draft initial Prisma migration offline (temporary)

on:
  push:
    branches: [feature/onboarding-fullstack-sync]
    paths: ['.github/workflows/onboarding-migration-bootstrap.yml']

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    env:
      # This local placeholder is never contacted: diff compares empty -> schema.
      DATABASE_URL_UNPOOLED: "postgresql://unused:unused@localhost:5432/momentum"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Create migration SQL from schema without database connection
        run: |
          pnpm db:validate
          mkdir -p prisma/migrations/20261118_onboarding_foundation
          pnpm exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output prisma/migrations/20261118_onboarding_foundation/migration.sql
          test -s prisma/migrations/20261118_onboarding_foundation/migration.sql
          grep -q "CREATE TABLE" prisma/migrations/20261118_onboarding_foundation/migration.sql
      - name: Commit SQL draft and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/onboarding-migration-bootstrap.yml
          git add prisma/migrations/20261118_onboarding_foundation/migration.sql
          git commit -m "db: draft identity squad avatar migration for review"
          git fetch origin feature/onboarding-fullstack-sync
          git rebase origin/feature/onboarding-fullstack-sync
          git push origin HEAD:feature/onboarding-fullstack-sync
