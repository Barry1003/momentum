name: F01 dependency bootstrap (temporary)

on:
  push:
    branches: [feature/f01-auth-implementation]
    paths:
      - 'package.json'
      - '.github/workflows/f01-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and pin dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(f01): refresh pnpm lockfile"
            git push origin HEAD:feature/f01-auth-implementation
          fi
