name: F01 dependency bootstrap (temporary)

on:
  push:
    branches: [feature/f01-auth-implementation]
    paths:
      - '.github/workflows/f01-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm db:validate
          pnpm db:generate
      - name: Commit pinned lockfile and remove temporary bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f01-bootstrap.yml
          git add pnpm-lock.yaml
          git commit -m "chore(f01): pin Better Auth dependency and remove bootstrap"
          git fetch origin feature/f01-auth-implementation
          git rebase origin/feature/f01-auth-implementation
          git push origin HEAD:feature/f01-auth-implementation
