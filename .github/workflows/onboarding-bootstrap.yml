name: Generate onboarding integration lockfile (temporary)

on:
  push:
    branches: [feature/onboarding-fullstack-sync]
    paths: ['.github/workflows/onboarding-bootstrap.yml']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and Prisma schema
        run: |
          pnpm install --no-frozen-lockfile
          pnpm db:validate
          pnpm db:generate
      - name: Commit lockfile and remove temporary bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/onboarding-bootstrap.yml
          git add pnpm-lock.yaml
          git commit -m "chore: pin combined frontend and backend dependencies"
          git fetch origin feature/onboarding-fullstack-sync
          git rebase origin/feature/onboarding-fullstack-sync
          git push origin HEAD:feature/onboarding-fullstack-sync
