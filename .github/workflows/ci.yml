name: Momentum CI

on:
  push:
    branches: [main, frontend, backend, error-fixes]
  pull_request:
    branches: [main, frontend, backend, error-fixes, feature/f01-auth-implementation, feature/f02-squads, feature/f03-goals-tasks]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Build
        run: pnpm build
