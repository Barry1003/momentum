name: Momentum CI

on:
  push:
    branches: [main, frontend, backend, error-fixes, integration/frontend-backend-core]
  pull_request:
    branches: [main, frontend, backend, error-fixes]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Production build
        run: pnpm build
